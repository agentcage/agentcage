# agentcage basic example — Firecracker microVM isolation
name: basic

isolation: firecracker
firecracker:
  # kernel is optional — auto-downloaded to ~/.local/share/agentcage/firecracker/
  vcpus: 2
  mem_mb: 2048
  jailer: false

container:
  image: "node:22-slim"
  command: ["node", "/app/agent.js"]
  volumes:
    - "${AGENT_DIR}:/app:ro"

domains:
  mode: allowlist
  list:
    - httpbin.org

secrets:
  enabled: true

log_allowed: true
