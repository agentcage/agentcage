# agentcage basic example — Lima VM isolation
#
# VM mode doesn't support host volume mounts, so the agent code
# must be baked into the container image.  Build it first:
#   podman build -t basic-agent examples/basic/agent

name: basic

isolation: vm
vm:
  vcpus: 2
  mem_mb: 2048

container:
  image: "localhost/basic-agent:latest"
  command: ["node", "/app/agent.js"]
  ports:
    - "127.0.0.1:3000:3000"

domains:
  allow:
    - httpbin.org

secrets:
  enabled: true

log_allowed: true
