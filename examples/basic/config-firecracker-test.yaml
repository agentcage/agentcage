# agentcage basic example — Firecracker microVM isolation (e2e test)
name: basic

isolation: firecracker
firecracker:
  kernel: /home/luca/firecracker/vmlinux-6.1.128
  vcpus: 2
  mem_mb: 2048
  jailer: false

container:
  image: "localhost/basic-agent:latest"
  command: ["node", "/app/agent.js"]

domains:
  mode: allowlist
  list:
    - httpbin.org

secrets:
  enabled: true

log_allowed: true
