name: acme-agent
isolation: container
lifecycle: service
scaffold: claude-code
container:
  image: docker.io/library/node:22-slim
  command:
  - node
  - /app/agent.js
  user: 1000:1000
  read_only: true
  no_new_privileges: true
  drop_capabilities:
  - ALL
  add_capabilities: []
  memory: 4g
  cpus: '2.0'
  volumes:
  - ${WORKSPACE_ROOT}/src:/workspace:rw
  - ${WORKSPACE_ROOT}/ro-assets:/assets:ro
  named_volumes:
    acme-agent-npm: /home/node/.npm:rw
  tmpfs:
  - /tmp:rw,noexec,nosuid,size=64M
  env:
    NODE_ENV: production
    AGENT_PROFILE: fixture
  ports:
  - 127.0.0.1:18080:3000
  nested_containers: false
  restart: on-failure
  restart_sec: 10
  timeout_start_sec: 300
  timeout_stop_sec: 60
dns_servers:
- 1.1.1.1
- 9.9.9.9
domains:
  mode: allowlist
  allow:
  - api.anthropic.com
  - github.com
  - '*.githubusercontent.com'
  - registry.npmjs.org
  - openrouter.ai
  block:
  - telemetry.example.com
  passthrough:
  - pinned-api.example.com
  expires:
    temp-download.example.com: '2026-09-08T18:00:00Z'
ports:
  tcp:
    allow:
    - 80
    - 443
    - 993
    passthrough: []
  udp:
    allow: []
  icmp:
    allow: false
secrets:
  backend: systemd-creds
  scope: user
  allow_plaintext: false
secret_injection:
- env: ANTHROPIC_API_KEY
  placeholder: agentcage:secret:ANTHROPIC_API_KEY:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  inject_to:
  - api.anthropic.com
  inject_headers:
  - x-api-key
  inject_body: false
  source: systemd-creds:ANTHROPIC_API_KEY
- env: GITHUB_TOKEN
  placeholder: agentcage:secret:GITHUB_TOKEN:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  inject_to:
  - github.com
  - '*.githubusercontent.com'
  inject_headers:
  - authorization
  inject_body: false
  source: env:FIXTURE_GITHUB_TOKEN
- env: IMAP_PASSWORD
  inject_to:
  - imap.example.com
  inject_body: true
  placeholder: agentcage:secret:IMAP_PASSWORD:0f1e2d3c4b5a69788796a5b4c3d2e1f0
agents:
  decider:
    enable: true
    provider: openrouter
    model: z-ai/glm-5.3
    api_key: systemd-creds:OPENROUTER_API_KEY
    context: 'Fixture cage. Approve official package registries only.

      '
    rate_limit_rps: 2.0
    rate_limit_burst: 5
  watcher:
    enable: true
    provider: openrouter
    model: z-ai/glm-5.3
    api_key: systemd-creds:OPENROUTER_API_KEY
    interval_seconds: 300
    window_seconds: 600
    max_flows: 100
    auto_revoke: true
    dedup_samples: true
    max_digest_tokens: 8000
    context: 'Fixture cage. Flag encoded source code in request bodies.

      '
protocol_relays:
- name: mail
  type: imap
  listen: 0.0.0.0:1143
  upstream:
    host: imap.example.com
    port: 993
    tls: true
    tls_servername: imap.example.com
    ca_file: ~/fixture-ca.pem
  policy:
    write_mode: organise
    folder_allowlist:
    - INBOX
    - Archive
    folder_denylist:
    - Trash
  auth:
    user: agent@example.com
    password_source: systemd-creds:IMAP_PASSWORD
capture:
  enable_har: true
  max_body_size: 1048576
  max_file_size: 104857600
  min_action: allowed
  domains: []
  exclude_domains:
  - registry.npmjs.org
logging:
  level: info
  dns_queries: true
  proxy_connections: true
  allowed_requests: false
max_request_body: 10485760
exec_aliases:
  claude:
  - claude
  - --print
help: 'Fixture cage used by the state-compatibility test suite.

  '
