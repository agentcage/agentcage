# agentcage e2e test config

container:
  image: "docker.io/node:22-slim"
  command: ["node", "/app/test.js"]
  volumes:
    - "./test-agent:/app:ro"
  env: {}

domains:
  mode: allowlist
  list:
    - httpbin.org

secrets:
  enabled: true
  action: block
  extra_patterns: []

max_request_body: 10485760

log_allowed: true
