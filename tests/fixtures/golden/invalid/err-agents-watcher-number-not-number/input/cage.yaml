name: err-agents-watcher-number-not-number
container:
  image: docker.io/library/node:22-slim
  command:
  - node
  - /app/agent.js
domains:
  allow:
  - api.example.com
  - cdn.example.com
dns_servers:
- 192.0.2.53
agents:
  watcher:
    enable: true
    provider: anthropic
    model: m
    api_key: env:K
    interval_seconds: soon
