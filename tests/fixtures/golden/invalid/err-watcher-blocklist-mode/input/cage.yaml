name: err-watcher-blocklist-mode
container:
  image: docker.io/library/node:22-slim
  command:
  - node
  - /app/agent.js
domains:
  block:
  - bad.example.com
dns_servers:
- 192.0.2.53
agents:
  watcher:
    enable: true
    provider: anthropic
    model: claude-fake-1
    api_key: systemd-creds:FAKE_KEY
