name: err-decider-api-key-cmd
container:
  image: docker.io/library/node:22-slim
  command:
  - node
  - /app/agent.js
domains:
  allow:
  - api.example.com
  - cdn.example.com
dns_servers:
- 192.0.2.53
agents:
  decider:
    enable: true
    provider: anthropic
    model: claude-fake-1
    api_key: cmd:printf fake
