name: err-relay-unknown-type
container:
  image: docker.io/library/node:22-slim
  command:
  - node
  - /app/agent.js
domains:
  allow:
  - api.example.com
  - cdn.example.com
dns_servers:
- 192.0.2.53
protocol_relays:
- name: mail
  type: pop3
  listen: 0.0.0.0:1110
  upstream:
    host: h.example.com
    port: 110
