name: err-agents-llm-timeout-bool
container:
  image: docker.io/library/node:22-slim
  command:
  - node
  - /app/agent.js
domains:
  allow:
  - api.example.com
  - cdn.example.com
dns_servers:
- 192.0.2.53
agents:
  decider:
    enable: true
    provider: anthropic
    model: m
    api_key: env:K
    timeout_seconds: true
