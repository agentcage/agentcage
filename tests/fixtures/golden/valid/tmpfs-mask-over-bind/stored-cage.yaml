name: tmpfs-mask-over-bind
container:
  image: docker.io/library/node:22-slim
  command:
  - node
  - /app/agent.js
  volumes:
  - ${HOME}/project:/workspace:rw
  tmpfs:
  - /workspace/.git/hooks:rw,noexec,nosuid,nodev,size=64M
domains:
  allow:
  - api.example.com
  - cdn.example.com
dns_servers:
- 192.0.2.53
