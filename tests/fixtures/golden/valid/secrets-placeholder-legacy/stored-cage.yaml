name: secrets-placeholder-legacy
container:
  image: docker.io/library/node:22-slim
  command:
  - node
  - /app/agent.js
domains:
  allow:
  - api.example.com
  - cdn.example.com
dns_servers:
- 192.0.2.53
secret_injection:
- env: LEGACY_KEY
  placeholder: '{{LEGACY_KEY}}'
  inject_to:
  - api.example.com
