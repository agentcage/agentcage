name: misc-help-and-aliases
container:
  image: docker.io/library/node:22-slim
  command:
  - node
  - /app/agent.js
domains:
  allow:
  - api.example.com
  - cdn.example.com
dns_servers:
- 192.0.2.53
help: 'Open http://localhost:3000 in your browser.

  '
exec_aliases:
  agent:
  - node
  - agent.js
  sh:
  - /bin/sh
scaffold: claude-code
