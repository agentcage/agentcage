name: secrets-injection-options
container:
  image: docker.io/library/node:22-slim
  command:
  - node
  - /app/agent.js
domains:
  allow:
  - api.example.com
  - cdn.example.com
dns_servers:
- 192.0.2.53
secret_injection:
- env: BODY_KEY
  placeholder: agentcage:secret:BODY_KEY:11111111111111111111111111111111
  inject_to:
  - api.example.com
  source: env:GOLDEN_SET_VAR
  inject_body: true
  inject_headers:
  - ' x-honeycomb-team '
  - X-Custom-Auth
