name: proxy-keys-rate-limit
container:
  image: docker.io/library/node:22-slim
  command:
  - node
  - /app/agent.js
domains:
  allow:
  - api.example.com
  - cdn.example.com
dns_servers:
- 192.0.2.53
rate_limit:
  requests_per_second: 5
  burst: 20
max_request_body: 2097152
entropy:
  threshold: 4.2
  action: flag
content_type:
  action: block
  allow:
  - application/json
secrets:
  enabled: true
  action: block
  extra_patterns:
  - FAKE-[0-9]{4}
