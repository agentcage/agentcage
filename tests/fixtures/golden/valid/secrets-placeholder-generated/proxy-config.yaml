domains:
  allow:
  - api.example.com
  - cdn.example.com
secret_injection:
- env: GEN_ONE
  inject_to:
  - api.example.com
  placeholder: agentcage:secret:GEN_ONE:00000000000000000000000000000001
- env: GEN_TWO
  inject_to:
  - cdn.example.com
  source: env:GOLDEN_SET_VAR
  placeholder: agentcage:secret:GEN_TWO:00000000000000000000000000000002
agentcage_version: 0.0.0-golden
