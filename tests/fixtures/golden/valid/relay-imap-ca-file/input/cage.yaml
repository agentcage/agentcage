name: relay-imap-ca-file
container:
  image: docker.io/library/node:22-slim
  command:
  - node
  - /app/agent.js
domains:
  allow:
  - api.example.com
  - cdn.example.com
dns_servers:
- 192.0.2.53
protocol_relays:
- name: mail
  type: imap
  listen: 0.0.0.0:1143
  upstream:
    host: imap.example.com
    port: 993
    tls: true
    ca_file: ${HOME}/certs/fake-ca.pem
  auth:
    password_source: env:GOLDEN_SET_VAR
ports:
  tcp:
    allow:
    - 80
    - 443
    passthrough:
    - 1143
