name: agents-decider-full
container:
  image: docker.io/library/node:22-slim
  command:
  - node
  - /app/agent.js
domains:
  allow:
  - api.example.com
  - cdn.example.com
dns_servers:
- 192.0.2.53
agents:
  decider:
    enable: true
    provider: anthropic
    model: claude-fake-1
    api_key: env:GOLDEN_SET_VAR
    host: control.agentcage.local
    context: This cage builds documentation for an internal wiki.
    rate_limit:
      requests_per_second: 0
      burst: 0
    timeout_seconds: 20
    max_tokens: 4096
