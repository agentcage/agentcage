name: secrets-transform-google-jwt
container:
  image: docker.io/library/node:22-slim
  command:
  - node
  - /app/agent.js
domains:
  allow:
  - oauth2.googleapis.com
dns_servers:
- 192.0.2.53
secret_injection:
- env: GOOGLE_SA
  placeholder: agentcage:secret:GOOGLE_SA:22222222222222222222222222222222
  inject_to:
  - oauth2.googleapis.com
  source: env:GOLDEN_SET_VAR
  transform: google-jwt-bearer
  transform_config:
    scope: https://www.googleapis.com/auth/cloud-platform
