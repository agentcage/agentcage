name: backend-apple-container-copyup-unseedable
container:
  image: docker.io/library/node:22-slim
  command:
  - node
  - /app/agent.js
  named_volumes:
    state: /var/lib/state:rw
  tmpfs:
  - /var/lib/state/secrets:rw,tmpcopyup
  - /plain/image/dir:rw,tmpcopyup
domains:
  allow:
  - api.example.com
  - cdn.example.com
dns_servers:
- 192.0.2.53
isolation: apple-container
