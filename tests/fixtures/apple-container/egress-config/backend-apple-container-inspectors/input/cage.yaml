name: backend-apple-container-inspectors
container:
  image: docker.io/library/node:22-slim
  command:
  - node
  - /app/agent.js
domains:
  allow:
  - api.example.com
  - cdn.example.com
dns_servers:
- 192.0.2.53
isolation: apple-container
inspectors:
- name: domain
- name: not-a-real-inspector
- name: custom
  path: /etc/agentcage/inspectors/x.py
