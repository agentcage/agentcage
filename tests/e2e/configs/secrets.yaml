name: e2e-secrets
container:
  image: "node:22-slim"
  command: ["node", "/app/agent.js"]
  volumes:
    - "${AGENT_DIR}:/app:ro"
  ports:
    - "127.0.0.1:${E2E_PORT_SECRETS}:3000"
domains:
  allow:
    - httpbin.org
secret_injection:
  - env: MY_API_KEY
    placeholder: "{{MY_API_KEY}}"
    inject_to:
      - httpbin.org
