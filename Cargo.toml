# agentcage Rust workspace.
#
# The crates live under `rust/`; the trees the binary embeds (image
# build contexts, templates, scaffolds) under `src/agentcage/`. The
# manifest sits at the repo root so `cargo build`, `cargo test` and
# `cargo clippy` work from the root, and so `target/` has one home
# instead of one per crate.
#
# See docs/history/rust-port-plan.md section 5, Phase 0 and the
# Track B table for why this exists.

[workspace]
resolver = "3"
members = [
    "rust/agentcage-core",
    "rust/agentcage-assets",
    "rust/agentcage-exec",
    "rust/agentcage-state",
    "rust/agentcage-cli",
    "rust/agentcage-egress",
    "rust/agentcage-egress-embed",
    # Repository maintenance tasks (`cargo xtask`); never shipped.
    "rust/xtask",
    # Mock upstreams for tests/e2e (a static musl binary the harness runs
    # beside each cage's egress) and the harness's own tests.
    "rust/agentcage-e2e-mock",

    "rust/agentcage-inspector-sdk",
    # Example custom inspectors (WebAssembly components). Members so they
    # share the lockfile and are built and linted natively by
    # `cargo test --workspace`; the egress tests build them for
    # wasm32-wasip2 when that target is installed.
    "examples/inspectors/header-policy",
    "examples/inspectors/dlp-regex",
    "rust/agentcage-egress/tests/fixtures/misbehaving-inspector",
    "rust/agentcage-egress/tests/fixtures/legacy-inspector",
]
# The egress fuzz targets are their own workspace: they build only on
# nightly (cargo-fuzz), so stable `--workspace` commands must not see them.
exclude = ["rust/agentcage-egress/fuzz"]

# ── Shared package metadata ──────────────────────────────────
#
# `version` here is the one the whole workspace inherits, and it is a
# copy of the root VERSION file. Cargo cannot read a version out of a
# file, and a build.rs that did would move the number out of the
# manifest where `cargo metadata`, Cargo.lock and any future release
# tooling look for it.
#
# So the number is duplicated and the duplication is *guarded*:
# scripts/check-version.sh exists to notice exactly this kind of drift
# (against the CHANGELOG too). Keep VERSION as the thing you edit; this follows.
[workspace.package]
version = "0.52.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/agentcage/agentcage"
authors = ["Luca Martinetti"]

# ── Shared lints ─────────────────────────────────────────────
#
# Every member opts in with `[lints] workspace = true`, so a lint added
# here reaches the crates Tracks C, D and E will fill in without another
# edit.
#
# These are `warn`, not `deny`, on purpose. `deny` in the manifest makes
# a new rustc release break `cargo build` for anyone who upgrades, which
# is a bad trade for a tool people install. CI is where warnings are
# fatal: `.github/workflows/rust.yml` runs clippy with `-D warnings`, so
# nothing warning-clean-on-my-machine can merge, and a toolchain bump
# breaks CI rather than every contributor's build.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stderr = "allow"
print_stdout = "allow"
# New in clippy 1.99, and it fired on ~90 `assert!(x.is_empty())` lines,
# all in tests. Its fix (`assert_eq!(x, [] as [T; 0])`) spells out the
# element type at every site, which is noise; a failing test already
# names the line. Revisit if the suggestion gets shorter.
assert_is_empty = "allow"

# ── Release profile ──────────────────────────────────────────
#
# Section 2.5 of the plan sells this port partly on startup time and on
# shipping a single binary, so the release profile optimizes for size
# and for a binary with no loose ends rather than for raw throughput.
# The CLI's hot path is process start, not compute.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

# Note the absence of `panic = "abort"`. It would shave a little size, but
# this program stages secrets into tmpfs, records mask mountpoints it has
# to unwind later, and writes temp files via O_EXCL before renaming them
# into place. Those are exactly the jobs RAII guards exist for, and an
# aborting panic runs no Drop impl -- a crash mid-deploy could leave real
# credentials staged on disk, which is the one outcome this project is
# built to prevent. Unwinding keeps that cleanup reachable.
#
# This is a decision worth revisiting once the Track C/D code exists, but
# it has to be made now rather than inherited, because whether Drop can be
# relied on changes how that code gets written.

# ── The egress is the exception ──────────────────────────────
#
# The egress is the one binary here whose hot path is compute: every byte
# an agent sends or receives is decrypted, parsed, scanned and re-encrypted
# in it. So it and the crates its per-request path spends its time in are
# built for speed, while everything else (the CLI, and the egress's cold
# parts: config parsing, the wasm compiler, the CLI parser) keeps `z`.
#
# Per-package overrides rather than a separate profile, so `cargo build
# --release -p agentcage-egress` keeps producing the shipped artifact in
# `target/<triple>/release/`, where CI, the publish workflow and the embed
# crate's build script look for it. Under LTO a function keeps the size
# attributes of the crate it was compiled in, so the list matters even
# though everything is optimized together at link time. The CLI shares
# only flate2/miniz_oxide/memchr/crc32fast/sha2 from it, which barely
# move its size.
[profile.release.package.agentcage-egress]
opt-level = 3
# TLS, both sides of every connection.
[profile.release.package.rustls]
opt-level = 3
[profile.release.package.ring]
opt-level = 3
[profile.release.package.tokio-rustls]
opt-level = 3
[profile.release.package.rustls-webpki]
opt-level = 3
# The runtime and the HTTP/1 and HTTP/2 codecs.
[profile.release.package.tokio]
opt-level = 3
[profile.release.package.bytes]
opt-level = 3
[profile.release.package.h2]
opt-level = 3
[profile.release.package.http]
opt-level = 3
[profile.release.package.httparse]
opt-level = 3
[profile.release.package.hashbrown]
opt-level = 3
[profile.release.package.indexmap]
opt-level = 3
[profile.release.package.tungstenite]
opt-level = 3
# Body scanning and secret injection/redaction.
[profile.release.package.memchr]
opt-level = 3
[profile.release.package.aho-corasick]
opt-level = 3
[profile.release.package.regex]
opt-level = 3
[profile.release.package.regex-automata]
opt-level = 3
[profile.release.package.encoding_rs]
opt-level = 3
[profile.release.package.base64]
opt-level = 3
# Content-encoding of inspected bodies.
[profile.release.package.flate2]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.adler2]
opt-level = 3
[profile.release.package.brotli-decompressor]
opt-level = 3
[profile.release.package.ruzstd]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
