[package]
name = "agentcage-assets"
description = "Embeds and extracts agentcage's data/, templates/ and scaffolds/ trees."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The three Python trees are read by build.rs, which turns them into
# include_bytes!. They are outside the crate directory, so `cargo
# package` would not carry them -- this crate is not published, and the
# workspace builds a binary, so that is fine. Say so rather than leave a
# future packaging attempt to discover it.
publish = false

[dependencies]
# The only runtime dependency, and not a negotiable one: the egress
# content hash is *defined* as SHA-256 (egress_hash.py), so the choice is
# between an audited implementation and hand-rolling a primitive. Use the
# audited one. `default-features = false` drops `std` and the asm
# backend; the digest is computed over half a megabyte at most, so the
# assembly implementation buys nothing worth a build-time C dependency.
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
# Test-only, and test-only on purpose: the fixture check reads
# tests/fixtures/egress_hash.json, and hand-rolling a JSON reader to
# keep the count at zero would mean a mismatch could come from the
# parser rather than the hash. Nothing in the shipped binary links this.
serde_json = "1"

[lints]
workspace = true
