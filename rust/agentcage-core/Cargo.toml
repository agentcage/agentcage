[package]
name = "agentcage-core"
description = "Pure agentcage logic: config, fingerprint, audit, HAR, quadlet rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# `serde`/`serde_json` arrive with PR C5 (audit.py). `audit.jsonl` is a
# JSON-per-line format whose records carry fields this version does not
# know about, so the port needs a real parser that round-trips unknown
# keys -- and `serde_json`'s `Map` is a `BTreeMap`, which reproduces
# Python's `json.dumps(sort_keys=True)` key order for free. Nothing else
# was added: the terminal table and colour output the golden corpus
# checks are plain format strings, because matching Python byte for byte
# is easier than talking a table crate out of its own opinions.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Test-only, and deliberately not a runtime dependency.
#
# `volume_mounts` itself moves strings around and needs nothing. What
# needs JSON is the golden-corpus test: the corpus stores each case's
# `volume-mounts.json` exactly as Python's
# `json.dumps(..., indent=2, sort_keys=True, ensure_ascii=False)` wrote
# it, and the test rebuilds that document and compares the bytes. Hand-
# rolling an emitter to match CPython's would put the thing under test
# and the thing testing it in the same pair of hands.
#
# serde_json's defaults line up with those arguments: two-space pretty
# printing, `Map` ordered as a `BTreeMap` (so `sort_keys=True` for the
# ASCII keys here), and no \uXXXX escaping of non-ASCII.
[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
