[package]
name = "agentcage-core"
description = "Pure agentcage logic: config, fingerprint, audit, HAR, quadlet rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# `serde`/`serde_json` arrive with PR C5 (audit.py). `audit.jsonl` is a
# JSON-per-line format whose records carry fields this version does not
# know about, so the port needs a real parser that round-trips unknown
# keys -- and `serde_json`'s `Map` is a `BTreeMap`, which reproduces
# Python's `json.dumps(sort_keys=True)` key order for free. Nothing else
# was added: the terminal table and colour output the golden corpus
# checks are plain format strings, because matching Python byte for byte
# is easier than talking a table crate out of its own opinions.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The YAML stack (PR B2). Two crates, and the second one is not a
# duplicate of the first.
#
# `serde_norway` is the maintained fork of the deprecated `serde_yaml`:
# serde integration, `IndexMap`-backed mappings so key order survives,
# and a maintainer who also adopted the C libyaml shim under it
# (`unsafe-libyaml-norway`) rather than leaving it frozen. It owns the
# value tree and the scalar emitting.
#
# `saphyr-parser` is a pure-Rust YAML *event* parser, used for exactly
# one thing `serde_norway` cannot answer: whether a scalar was written
# plain or quoted. PyYAML resolves a plain `no` to `False` and a quoted
# `'no'` to the string, and agentcage has to tell those apart or a
# relay's `tls: 'no'` changes meaning across the port. Every serde YAML
# crate discards scalar style, so the style comes from a second parse
# and is overlaid on the first parser's tree. See `src/yaml/style.rs`
# for the alignment rules and how it fails closed.
# Insertion-ordered maps for the config tree (PR C1). `cage.yaml`
# key order is user-visible after `cage edit` (`save_raw_config`
# passes `sort_keys=False`) and `quadlets.py` emits one
# `Environment=` line per entry in Python `dict` order, so a
# `BTreeMap` would silently re-sort both. `serde_norway` already
# depends on this crate for the same reason, so it costs nothing new
# in the tree.
# `features = ["serde"]` is PR C8's: the quadlet render context is
# built from `Serialize` structs, and `container.env` /
# `container.named_volumes` reach the templates as these maps
# directly, so they have to serialize -- in order.
indexmap = { version = "2", features = ["serde"] }

serde_norway = "0.9.42"
saphyr-parser = "0.1.0"

# The fingerprint (PR C4). `cage update` decides whether a cage needs
# redeploying by comparing a sha256-of-sha256s against the
# `fingerprint.json` the last deploy wrote -- including, at cutover, one
# the Python wrote. `sha2` is the RustCrypto implementation: no C, no
# system OpenSSL to find, and a fixed output for a fixed input on every
# target, which is the only property that matters here.
sha2 = "0.10"

# The cage subnet (PR C8). `cage_network_addrs` derives a cage's
# `10.89.<octet>.0/24` from `md5(name)[:8] % 254 + 1`, and an already
# deployed cage's podman network is pinned to the octet Python computed
# -- a different answer renders static IPs outside the existing subnet
# and the egress refuses to start. So the digest is a compatibility
# constraint, not a security one (it buckets a name; nothing trusts it),
# and `md-5` is the RustCrypto sibling of `sha2` above, sharing its
# `Digest` trait and adding no new transitive dependency.
md-5 = "0.10"

# Template rendering (PR C8). The `.j2` sources under
# `src/agentcage/templates/` are NOT rewritten by the port: they are
# still rendered by Python until cutover, so they have to keep working
# for both, and minijinja is Jinja2-compatible enough to render them
# unmodified.
#
# Features are pared to what the templates actually reach:
#
#   * `builtins` -- `join`, `default`, `indent`, `lower`.
#   * `serde` -- the render context is built from `Serialize` values,
#     including the config's own `IndexMap`s.
#   * `preserve_order` -- load-bearing, not cosmetic. `cage.container.j2`
#     emits one `Environment=` line per `container.env` entry via
#     `env.items()`, and the corpus records them in cage.yaml order.
#     Without this, minijinja's `ValueMap` is a `BTreeMap` and every
#     generated unit silently re-sorts those lines. It pulls in
#     `indexmap`, which this crate already depends on for the same
#     reason.
#
# Dropped: `multi_template`/`macros` (no template `include`s, `extend`s
# or `macro`s -- checked across `templates/**`), `deserialization` (the
# context only goes in), `adjacent_loop_items` (`loop.last` is core;
# `loop.previtem`/`nextitem`/`changed` are unused), `std_collections`
# (the maps that reach a template are `IndexMap`s, serialized via
# `serde`), and `debug` (its contribution is a source excerpt appended
# to render errors; the template name and line number are in the error
# either way, and these templates are fixed at compile time).
minijinja = { version = "2.24", default-features = false, features = [
    "builtins",
    "serde",
    "preserve_order",
] }

# The `.j2` sources themselves, which this crate does not read from
# disk. `agentcage-assets` already embeds `templates/` for exactly this
# reason (its `EMBEDDED_TREES` docs name PR C8), so the alternative was
# a second `include_str!` copy of the same bytes in the binary and two
# places to notice when a template is added. No cycle: the assets crate
# deliberately does not depend on this one.
agentcage-assets = { path = "../agentcage-assets" }

# Test-only, and deliberately not a runtime dependency.
#
# `volume_mounts` itself moves strings around and needs nothing. What
# needs JSON is the golden-corpus test: the corpus stores each case's
# `volume-mounts.json` exactly as Python's
# `json.dumps(..., indent=2, sort_keys=True, ensure_ascii=False)` wrote
# it, and the test rebuilds that document and compares the bytes. Hand-
# rolling an emitter to match CPython's would put the thing under test
# and the thing testing it in the same pair of hands.
#
# serde_json's defaults line up with those arguments: two-space pretty
# printing, `Map` ordered as a `BTreeMap` (so `sort_keys=True` for the
# ASCII keys here), and no \uXXXX escaping of non-ASCII.
[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

