[package]
name = "agentcage-egress"
description = "The per-cage egress proxy: TLS interception, inspection, secret injection, audit, Policy API, traffic watcher and protocol relays."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# One binary, run inside the egress container by `supervisor-egress.sh`
# as uid 200 with an empty bounding set. It is Linux-only at runtime
# (`SO_ORIGINAL_DST`, iptables REDIRECT), but the library half builds and
# tests everywhere so the pure modules run on a macOS laptop too.
[[bin]]
name = "agentcage-egress"
path = "src/main.rs"

[dependencies]
# The pure helpers the host already ported byte-for-byte from Python:
# `valid_domain`, `encoded_private_ip`, the never-grant floor, the relay
# validator, the PyYAML-compatible loader, the `json.dumps`-compatible
# writer and CPython `isoformat` timestamps. Reused, not copied, so the
# host and the egress cannot drift apart on any of them.
agentcage-core = { path = "../agentcage-core" }

# The config tree `agentcage_core::yaml::load` returns.
serde_norway = "0.9.42"
indexmap = "2"

# Capture bodies and WebSocket frames that are not UTF-8 are stored as
# standard base64 (`base64.b64encode` in the replaced implementation).
base64 = "0.22"

# The LLM decider's and watcher's outbound HTTPS client: small, blocking
# (run off the async runtime), rustls with the ring provider and the
# Mozilla roots from webpki-roots (plan D8). No OpenSSL, no cmake.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]

[lints]
workspace = true
