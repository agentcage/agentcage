name: Apple-container supervisor

# Catches supervisor regressions on every PR. After the v0.22 #196 refactor,
# the apple-container backend uses a 2-microVM model: the cage microVM has a
# minimal cage-init.sh entrypoint (no supervisor.sh anymore), and the egress
# microVM uses the unified supervisor-egress.sh from src/agentcage/data/
# containers/ — same supervisor across all three backends now.
#
# Both scripts are security-critical PID-1's:
#   cage-init.sh: sets default route via egress, capsh-drops to uid 1000
#                 BEFORE exec'ing the workload. Bugs here either crash the
#                 cage at boot or weaken the privilege drop.
#   supervisor-egress.sh: orchestrates dnsmasq + mitmproxy + iptables in
#                 the egress microVM/container. Bugs here weaken the
#                 allowlist + secret-injection enforcement.
#
# Both use `set -eu` so an unset-variable bug bricks the cage at boot —
# better to catch in CI than after deploy.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - 'src/agentcage/data/apple-container/**'
      - 'src/agentcage/data/containers/supervisor-egress.sh'
      - 'src/agentcage/data/containers/dns-audit.sh'
      - '.github/workflows/supervisor.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Lint cage-init.sh (apple-container cage microVM entrypoint)
        run: shellcheck src/agentcage/data/apple-container/cage-init.sh
      - name: Lint supervisor-egress.sh (unified egress supervisor)
        run: shellcheck src/agentcage/data/containers/supervisor-egress.sh
      - name: Lint dns-audit.sh (dnsmasq audit-line wrapper)
        run: shellcheck src/agentcage/data/containers/dns-audit.sh
