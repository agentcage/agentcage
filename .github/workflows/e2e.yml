name: E2E Tests

on:
  pull_request:
    branches: [master, egress/rust-port]
  push:
    branches: [master, egress/rust-port]
  workflow_dispatch:
  # Phase 7 only — see the e2e-vm job for why it is not on the PR path.
  schedule:
    - cron: "17 4 * * *"

# `tests/e2e/lib.sh` and `run.sh` take the binary under test from
# $AGENTCAGE; each job builds the release binary and points it there.
# Unit tests and fixtures check what the CLI decides; these check that
# the decision survives contact with podman, systemd and a live egress
# container.
jobs:
  e2e-container:
    name: E2E Container (Phases 1-6)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4


      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and target/
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: >-
            cargo-e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'rust/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-e2e-${{ runner.os }}-

      # --release, not debug: phase 6 has a 20s tmpfs-mask assertion and
      # phase 3 drives a live secret channel, both of which are timing
      # sensitive enough that an unoptimised binary is a false-failure
      # generator rather than a faster build.
      - name: Build agentcage
        run: |
          cargo build --release --locked --bin agentcage
          echo "AGENTCAGE=$PWD/target/release/agentcage" >> "$GITHUB_ENV"

      - name: Setup rootless Podman
        run: |
          # Ubuntu 24.04 ships Podman — ensure user session works
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman uidmap slirp4netns
          sudo loginctl enable-linger $(whoami)

          # Ensure XDG_RUNTIME_DIR is set (GitHub runners may not have it)
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo mkdir -p "$XDG_RUNTIME_DIR"
          sudo chown $(whoami) "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

          # Verify rootless Podman works
          podman info --format '{{.Host.Security.Rootless}}'

      - name: Cache Podman images
        uses: actions/cache@v4
        with:
          path: ~/.local/share/containers/storage
          key: podman-node22slim-${{ runner.os }}-${{ hashFiles('tests/e2e/mock-image.ref') }}

      # The e2e mock upstream runs in its own stock-python container joined
      # to the egress's network namespace (tests/e2e/lib.sh start_mock); its
      # pinned reference lives in tests/e2e/mock-image.ref.
      - name: Pull base images (if not cached)
        run: |
          podman image exists docker.io/library/node:22-slim 2>/dev/null || podman pull docker.io/library/node:22-slim
          MOCK_IMAGE=$(tr -d '[:space:]' < tests/e2e/mock-image.ref)
          podman image exists "$MOCK_IMAGE" 2>/dev/null || podman pull "$MOCK_IMAGE"

      - name: Run E2E container tests
        run: bash tests/e2e/run.sh container

  # Phases 1-6 against the Rust egress (AGENTCAGE_EGRESS_ENGINE=rust), the
  # second axis of the egress-engine matrix (EGRESS-PORT-PLAN.md P5.3).
  #
  # GATED OFF until the proxy core lands: until then `agentcage-egress`
  # is a placeholder that exits 2, every cage's egress fails to start, and
  # this job would burn its timeout on a known failure. Turn it on with
  # the repository variable AGENTCAGE_E2E_RUST_EGRESS=1. Even then it is
  # `continue-on-error` -- informational until it has been green on its
  # own for a while, when it should become required and the flag go.
  e2e-container-rust:
    name: E2E Container, Rust egress (Phases 1-6)
    if: vars.AGENTCAGE_E2E_RUST_EGRESS == '1'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AGENTCAGE_EGRESS_ENGINE: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain, the musl target and musl-gcc
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools

      - name: Cache cargo registry and target/
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: >-
            cargo-e2e-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'rust/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-e2e-rust-${{ runner.os }}-

      # The egress first: agentcage-egress-embed picks it up from
      # target/x86_64-unknown-linux-musl/release/, and REQUIRE turns a
      # miss into a build failure instead of a deploy-time one.
      - name: Build the egress, then agentcage embedding it
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AGENTCAGE_REQUIRE_EGRESS_BIN: "1"
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl -p agentcage-egress
          cargo build --release --locked --bin agentcage
          echo "AGENTCAGE=$PWD/target/release/agentcage" >> "$GITHUB_ENV"

      - name: Setup rootless Podman
        run: |
          sudo apt-get install -y -qq podman uidmap slirp4netns
          sudo loginctl enable-linger $(whoami)

          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo mkdir -p "$XDG_RUNTIME_DIR"
          sudo chown $(whoami) "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

          podman info --format '{{.Host.Security.Rootless}}'

      # The mock upstream runs in its own pinned python container
      # (tests/e2e/mock-image.ref), so nothing in the harness needs
      # python3 in the egress image -- which the Rust one does not have.
      - name: Pull base images
        run: |
          podman pull docker.io/library/node:22-slim
          podman pull "$(tr -d '[:space:]' < tests/e2e/mock-image.ref)"

      - name: Run E2E container tests
        run: bash tests/e2e/run.sh container

  e2e-openclaw:
    name: E2E OpenClaw (Phase 8)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4


      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and target/
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: >-
            cargo-e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'rust/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-e2e-${{ runner.os }}-

      - name: Build agentcage
        run: |
          cargo build --release --locked --bin agentcage
          echo "AGENTCAGE=$PWD/target/release/agentcage" >> "$GITHUB_ENV"

      - name: Install jq + skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq skopeo

      - name: Setup rootless Podman
        run: |
          sudo apt-get install -y -qq podman uidmap slirp4netns
          sudo loginctl enable-linger $(whoami)

          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo mkdir -p "$XDG_RUNTIME_DIR"
          sudo chown $(whoami) "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

          podman info --format '{{.Host.Security.Rootless}}'

      - name: Cache Podman images
        uses: actions/cache@v4
        with:
          path: ~/.local/share/containers/storage
          key: podman-openclaw-${{ runner.os }}-${{ hashFiles('src/agentcage/scaffolds/openclaw/**') }}

      - name: Pre-pull openclaw base image
        run: |
          podman image exists ghcr.io/openclaw/openclaw:latest \
            || podman pull ghcr.io/openclaw/openclaw:latest

      - name: Run phase 8
        run: bash tests/e2e/run.sh openclaw

  # Phase 7 — the Lima VM backend.
  #
  # Deliberately NOT on the pull_request path. It boots a real guest: a
  # ~350 MB Debian cloud image, a provision script, rootless podman
  # inside the guest, and three cage restarts. Locally it is three and a
  # half minutes with KVM and considerably longer without, and a
  # download that size is a flake source that would land on every PR
  # rather than on the ones that touch the backend.
  #
  # It runs nightly and on demand instead, which is the trade that
  # matters: before this job, NOTHING watched the vm backend
  # continuously. Assertion 7.21 asserted a path that stopped existing
  # when the home mount was narrowed, and stayed red and unnoticed
  # because no runner ever executed it. A nightly that reports rot the
  # next morning is the whole point.
  #
  # `runs-on: ubuntu-24.04` has /dev/kvm on GitHub's hosted Linux
  # runners; the step below checks rather than assumes, because the
  # failure mode without it is a silent fall back to TCG and a timeout.
  e2e-vm:
    name: E2E VM (Phase 7)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4


      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and target/
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: >-
            cargo-e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'rust/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-e2e-${{ runner.os }}-

      - name: Build agentcage
        run: |
          cargo build --release --locked --bin agentcage
          echo "AGENTCAGE=$PWD/target/release/agentcage" >> "$GITHUB_ENV"

      # Present is not usable. The runner ships /dev/kvm as root:kvm 0660
      # and the `runner` user is not in `kvm`, so QEMU's `-accel kvm`
      # fails with "Permission denied" and Lima exits within a second of
      # starting it. That was the whole of phase 7's first CI failure
      # ("FAIL (0/0, 13s)"). The udev rule is what Lima's own CI uses.
      - name: Check for KVM
        run: |
          test -e /dev/kvm || {
            echo "::error::/dev/kvm is absent; phase 7 would fall back to TCG and time out." >&2
            exit 1
          }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm || {
            echo "::error::/dev/kvm is not read-write for $(whoami); QEMU cannot use KVM." >&2
            exit 1
          }

      # Lima is pinned rather than resolved from the releases API, for
      # the same two reasons `lima.yaml.j2` pins the guest image: the
      # unauthenticated API is rate-limited per runner IP, and a new
      # Lima can change a default under us — 1.0 changing `mountType` to
      # 9p is exactly how every mount in that template started failing
      # silently on a kernel without CONFIG_9P_FS. Bump deliberately.
      - name: Install Lima and QEMU
        env:
          LIMA_VERSION: "2.2.0"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils podman uidmap slirp4netns
          curl -fsSL "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/lima-${LIMA_VERSION}-Linux-x86_64.tar.gz" \
            | sudo tar -C /usr/local -xzf -
          limactl --version

      - name: Cache the Lima base image
        uses: actions/cache@v4
        with:
          path: ~/.cache/lima
          key: lima-image-${{ hashFiles('src/agentcage/templates/lima/lima.yaml.j2') }}

      - name: Run phase 7
        run: bash tests/e2e/run.sh vm
