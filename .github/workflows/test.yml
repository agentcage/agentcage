name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  invariants:
    # docs/history/rust-port-plan.md §2.4. Three ways the shipped product
    # could quietly regain a Python dependency, none of which any other
    # check here would notice: the Rust binary shelling out to an
    # interpreter, the egress proxy importing a package its image does
    # not install (an ImportError inside the cage, found at runtime),
    # and a shipped Containerfile other than the egress installing
    # Python. Its own job because it is a static scan with no
    # dependencies that should fail in seconds rather than behind the
    # matrix.
    name: Python stays out of the shipped product
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python stays out of the shipped product
        run: python3 scripts/check-invariants.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --dev
      - run: uv run pytest
