# The Rust port's CI gate.
#
# Separate from test.yml on purpose. The Python suite must not grow a
# Rust dependency -- proxy work (data/proxy/** stays Python forever)
# should stay a pytest-only round trip, and the Rust job should not wait
# on a three-version Python matrix. Neither job can fail the other; both
# are required for a merge.
#
# Scope: `rust/**` plus the root workspace manifest. See
# RUST-PORT-PLAN.md (branch `rust-port`), section 5 Phase 0 and Track B.

name: Rust

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push to a PR makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # There are no dependencies to fetch yet, and when B2/B3 add some there
  # is still no reason to build with incremental state that the cache
  # then has to carry.
  CARGO_INCREMENTAL: 0
  # Full backtraces on a test failure; the runner is not the place to
  # re-run with RUST_BACKTRACE set.
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: build, test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup is preinstalled on the GitHub runners; this installs
      # whatever rust-toolchain.toml asks for, which is `stable` plus
      # clippy and rustfmt.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache cargo registry and target/
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # Cargo.lock is committed (this workspace produces a binary),
          # so it identifies the dependency set exactly. The manifests
          # are in the key too because a profile or lint change
          # invalidates every artifact in target/ without touching the
          # lockfile.
          key: >-
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'rust/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Formatting first: it needs no build, so a misformatted PR fails
      # in seconds instead of after a full compile.
      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      # The Rust->Python crossing test (PR B2). It is #[ignore]d so that
      # `cargo test` works without an interpreter -- the whole point of
      # the port is that Python stops being a runtime dependency -- but
      # the property it checks is a cross-language contract with the
      # egress proxy, so it has to run somewhere. Here.
      #
      # It asserts four things a pure-Rust test cannot: that every
      # scalar in tests/fixtures/yaml_1_1_scalars.json survives
      # `yaml.safe_load` as the string it went in as, that the bare crate
      # really does corrupt the ones the fixture calls hazardous (the
      # control arm), that every committed config means the same thing to
      # PyYAML after a Rust round trip, and -- the reading direction --
      # that `yaml::load` and `yaml.safe_load` produce the same value for
      # every document in the read-side corpus, including the four
      # corners of `tls: no` / `'no'` / `false` / `"false"`.
      - name: Rust to PyYAML crossing test
        run: |
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
          cargo test --locked -p agentcage-core --test yaml_pyyaml_crossing -- --ignored

      # The fingerprint crossing test (PR C4), #[ignore]d for the same
      # reason and run here for a different one. `cage update` decides
      # whether a cage needs redeploying by comparing a sha256 against
      # the fingerprint.json the last deploy wrote -- and at cutover
      # that file was written by the Python. The golden corpus proves
      # the port reproduces the 126 fingerprints that already exist;
      # this proves it reproduces the next one, over the inputs no
      # corpus case has: floats (Python's `repr` is not Rust's
      # `Display`), unbounded integers, and non-ASCII keys and values,
      # which `ensure_ascii=False` puts into the hash as raw UTF-8.
      - name: Fingerprint to CPython crossing test
        run: |
          cargo test --locked -p agentcage-core --test fingerprint_python_crossing -- --ignored

      # --all-targets covers tests and examples, which is where the lints
      # that matter (unwrap in a helper, a stray dbg!) actually land.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Cheap, and it is the check that would otherwise only fail during
      # a release: the version the binary reports has to be the one in
      # the root VERSION file. scripts/check-version.sh is the same
      # guard publish.yml runs.
      - name: Version agrees with the VERSION file
        run: |
          scripts/check-version.sh
          expected="agentcage, version $(cat VERSION)"
          actual=$(cargo run --quiet --locked --bin agentcage -- --version)
          echo "expected: $expected"
          echo "actual:   $actual"
          [ "$actual" = "$expected" ]
