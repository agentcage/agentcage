# The workspace's CI gate: the host CLI, the egress, and the repository
# invariants.
#
# The committed fixtures under tests/fixtures/ were recorded from earlier
# releases of the CLI; the Rust tests assert against them as golden
# files. See docs/history/rust-port-plan.md for their history.

name: Rust

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push to a PR makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # There are no dependencies to fetch yet, and when B2/B3 add some there
  # is still no reason to build with incremental state that the cache
  # then has to carry.
  CARGO_INCREMENTAL: 0
  # Full backtraces on a test failure; the runner is not the place to
  # re-run with RUST_BACKTRACE set.
  RUST_BACKTRACE: 1

jobs:
  # docs/history/rust-port-plan.md §2.4 and the egress cutover. A static
  # scan with no build of the workspace beyond the xtask itself, so it
  # fails in seconds rather than behind the full test run: Rust does not
  # shell out to a Python interpreter, no shipped image installs one, no
  # tracked file is Python, and no live file names the replaced egress
  # (see rust/xtask/src/invariants.rs).
  invariants:
    name: repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: cargo xtask check-invariants
        run: cargo xtask check-invariants

  rust:
    name: build, test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup is preinstalled on the GitHub runners; this installs
      # whatever rust-toolchain.toml asks for, which is `stable` plus
      # clippy and rustfmt.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      # Swatinem/rust-cache keys on the rustc actually installed, not on
      # rust-toolchain.toml: that file says only `stable`, so each runner
      # image brings its own release, and a key on the file restored
      # artifacts the newer compiler then rebuilt from scratch. It also
      # adds the job id, so jobs that build different things do not
      # share an entry, and prunes target/ to the current dependencies
      # before saving, so entries stop growing. Only master saves: a
      # PR's entry is visible to that PR alone, and it crowds master's
      # out of the repository's 10 GB.
      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Formatting first: it needs no build, so a misformatted PR fails
      # in seconds instead of after a full compile.
      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo build
        run: cargo build --workspace --locked

      # The egress plugin tests build the example custom inspectors as
      # WebAssembly components. Without the target they skip themselves
      # (so `cargo test` works on any laptop); here a missing target is a
      # failure, so the plugin path is always exercised.
      - name: Install the wasm32-wasip2 target
        run: rustup target add wasm32-wasip2

      - name: cargo test
        env:
          AGENTCAGE_REQUIRE_WASM: "1"
        run: cargo test --workspace --locked

      # --all-targets covers tests and examples, which is where the lints
      # that matter (unwrap in a helper, a stray dbg!) actually land.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Cheap, and it is the check that would otherwise only fail during
      # a release: the version the binary reports has to be the one in
      # the root VERSION file. scripts/check-version.sh is the same
      # guard publish.yml runs.
      - name: Version agrees with the VERSION file
        run: |
          scripts/check-version.sh
          expected="agentcage, version $(cat VERSION)"
          actual=$(cargo run --quiet --locked --bin agentcage -- --version)
          echo "expected: $expected"
          echo "actual:   $actual"
          [ "$actual" = "$expected" ]

  # The doc comments are load-bearing: the module docs are the
  # Python↔Rust mapping tables, and a `[`Thing`]` rustdoc cannot resolve
  # renders as literal text — a row that no longer points at anything.
  # `[workspace.lints.rustdoc]` denies that (and the private-target
  # variant) in every member, which is the part that makes a new one an
  # error. `-D warnings` is the belt to that suspenders: it also covers
  # rustdoc's own default warnings, which no manifest setting reaches.
  # No build of the workspace beyond what `cargo doc` needs, and
  # `--no-deps` keeps third-party crates' docs (and warnings) out of it.
  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup is preinstalled on the GitHub runners; this installs
      # whatever rust-toolchain.toml asks for.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Cached like the rust job above.
      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  # Dependency policy (deny.toml): RustSec advisories, licenses, banned
  # crates and sources. Separate from the build job so a new advisory
  # names itself in the job list instead of hiding in a long log. The
  # action pins cargo-deny itself (v2.1.1 ships cargo-deny 0.20.2); it is
  # pinned by commit, as a third-party action that sees the checkout.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  # The release path for the egress binary, on every PR: build it for
  # linux-musl, embed it in the host, and check what was embedded. The
  # job above builds the host without one (the default for a dev
  # checkout), so without this a broken embed would first show up in
  # publish.yml, during a release.
  egress-embed:
    name: musl egress, embedded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain, the musl target and musl-gcc
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools

      # Cached like the rust job above.
      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build the egress for linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p agentcage-egress

      # `AGENTCAGE_REQUIRE_EGRESS_BIN=1` makes "not found" a build
      # failure, so these tests cannot pass vacuously on the no-binary
      # branch.
      - name: Embed and stage it
        env:
          AGENTCAGE_REQUIRE_EGRESS_BIN: "1"
        run: |
          cargo test --locked -p agentcage-egress-embed
          cargo test --locked -p agentcage-cli --lib egress_image
          cargo build --release --locked --bin agentcage
