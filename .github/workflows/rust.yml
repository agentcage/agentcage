# The host CLI's CI gate.
#
# Separate from test.yml on purpose. The egress proxy suite must not grow
# a Rust dependency -- proxy work (data/proxy/** is Python) should stay a
# pytest-only round trip, and the Rust job should not wait on a
# three-version Python matrix. Neither job can fail the other; both are
# required for a merge.
#
# The committed fixtures under tests/fixtures/ were recorded from the
# Python CLI before it was removed; the Rust tests assert against them
# as golden files. See docs/history/rust-port-plan.md for their history.

name: Rust

on:
  push:
    branches: [master, egress/rust-port]
  pull_request:
    branches: [master, egress/rust-port]

# A new push to a PR makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # There are no dependencies to fetch yet, and when B2/B3 add some there
  # is still no reason to build with incremental state that the cache
  # then has to carry.
  CARGO_INCREMENTAL: 0
  # Full backtraces on a test failure; the runner is not the place to
  # re-run with RUST_BACKTRACE set.
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: build, test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup is preinstalled on the GitHub runners; this installs
      # whatever rust-toolchain.toml asks for, which is `stable` plus
      # clippy and rustfmt.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache cargo registry and target/
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # Cargo.lock is committed (this workspace produces a binary),
          # so it identifies the dependency set exactly. The manifests
          # are in the key too because a profile or lint change
          # invalidates every artifact in target/ without touching the
          # lockfile.
          key: >-
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'rust/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Formatting first: it needs no build, so a misformatted PR fails
      # in seconds instead of after a full compile.
      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      # The Rust->Python crossing test (PR B2). It is #[ignore]d so that
      # `cargo test` works without an interpreter -- Python is not a host
      # dependency -- but the property it checks is a cross-language
      # contract with the egress proxy, which reads the YAML the host
      # writes with PyYAML, so it has to run somewhere. Here.
      #
      # It asserts four things a pure-Rust test cannot: that every
      # scalar in tests/fixtures/yaml_1_1_scalars.json survives
      # `yaml.safe_load` as the string it went in as, that the bare crate
      # really does corrupt the ones the fixture calls hazardous (the
      # control arm), that every committed config means the same thing to
      # PyYAML after a Rust round trip, and -- the reading direction --
      # that `yaml::load` and `yaml.safe_load` produce the same value for
      # every document in the read-side corpus, including the four
      # corners of `tls: no` / `'no'` / `false` / `"false"`.
      - name: Rust to PyYAML crossing test
        run: |
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
          cargo test --locked -p agentcage-core --test yaml_pyyaml_crossing -- --ignored

      # --all-targets covers tests and examples, which is where the lints
      # that matter (unwrap in a helper, a stray dbg!) actually land.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Cheap, and it is the check that would otherwise only fail during
      # a release: the version the binary reports has to be the one in
      # the root VERSION file. scripts/check-version.sh is the same
      # guard publish.yml runs.
      - name: Version agrees with the VERSION file
        run: |
          scripts/check-version.sh
          expected="agentcage, version $(cat VERSION)"
          actual=$(cargo run --quiet --locked --bin agentcage -- --version)
          echo "expected: $expected"
          echo "actual:   $actual"
          [ "$actual" = "$expected" ]

  # The release path for the egress binary, on every PR: build it for
  # linux-musl, embed it in the host, and check what was embedded. The
  # job above builds the host without one (the default for a dev
  # checkout), so without this a broken embed would first show up in
  # publish.yml, during a release.
  egress-embed:
    name: musl egress, embedded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain, the musl target and musl-gcc
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools

      - name: Cache cargo registry and target/
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: >-
            cargo-embed-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml',
            'rust/*/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-embed-${{ runner.os }}-

      - name: Build the egress for linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p agentcage-egress

      # `AGENTCAGE_REQUIRE_EGRESS_BIN=1` makes "not found" a build
      # failure, so these tests cannot pass vacuously on the no-binary
      # branch.
      - name: Embed and stage it
        env:
          AGENTCAGE_REQUIRE_EGRESS_BIN: "1"
        run: |
          cargo test --locked -p agentcage-egress-embed
          cargo test --locked -p agentcage-cli --lib egress_engine
          cargo build --release --locked --bin agentcage
