description: "Anthropic Claude Code CLI agent"
lifecycle: interactive

# Short aliases — `agentcage run claude` resolves to this scaffold.
aliases:
  - claude

# Prefix used by `agentcage run` when auto-generating a cage name.
# Without this, cages are named `<scaffold>-<adj>-<noun>` (e.g.
# `claude-code-bold-fox`); with it, they are `claude-bold-fox`.
name_prefix: claude

# Credentials that each authenticate Claude Code on their own, in
# preference order. `agentcage run` needs one, not both: the one given
# with `-s`, else the first one exported in the environment. The template
# renders the secret_injection rule for that one only (`{{ auth }}`), so
# Claude Code never sees a placeholder for a credential nobody supplied.
auth:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN

build:
  - image: "localhost/agentcage-scaffold-claude-code:latest"
    containerfile: "Containerfile"
    cap_add: [CAP_SETFCAP, CAP_SETUID, CAP_SETGID, CAP_CHOWN, CAP_DAC_OVERRIDE, CAP_FOWNER]

next_steps:
  - "agentcage cage create -c {dest}"
  - "agentcage cage exec {name} -- claude"
  - "Or use: agentcage run claude-code"
