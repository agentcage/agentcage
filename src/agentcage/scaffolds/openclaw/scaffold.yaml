description: "Full-featured AI coding agent with browser automation"
lifecycle: service

build:
  - image: "localhost/agentcage-scaffold-openclaw"
    containerfile: "Containerfile"
    build_args:
      BASE_IMAGE: "ghcr.io/openclaw/openclaw"
    cap_add: [CAP_SETFCAP, CAP_SETUID, CAP_SETGID, CAP_CHOWN, CAP_DAC_OVERRIDE, CAP_FOWNER]

next_steps:
  - "Edit {dest} — uncomment additional providers/domains"
  - "agentcage cage create -c {dest}"
  - "agentcage secret set {name} ANTHROPIC_API_KEY"
  - "agentcage secret set {name} OPENCLAW_GATEWAY_PASSWORD"
  - "agentcage cage restart {name}"
