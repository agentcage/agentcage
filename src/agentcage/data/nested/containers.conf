[engine]
runtime = "crun"

[containers]
# Use host networking by default so inner containers share the cage's
# network namespace and all traffic routes through the agentcage proxy.
netns = "host"

# Forward HTTP_PROXY/HTTPS_PROXY from the cage environment to inner containers.
http_proxy = true

# Mount the egress CA cert and set SSL env vars so TLS interception works.
volumes = ["/certs/agentcage-ca.pem:/certs/agentcage-ca.pem:ro"]
env = ["SSL_CERT_FILE=/certs/agentcage-ca.pem", "NODE_EXTRA_CA_CERTS=/certs/agentcage-ca.pem"]

[network]
cni_plugin_dirs = ["/usr/lib/cni"]
network_config_dir = "/var/lib/containers/cni/net.d"
