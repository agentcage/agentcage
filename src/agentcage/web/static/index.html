<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentcage</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --fg: #e6edf3; --dim: #8b949e; --accent: #58a6ff;
    --ok: #3fb950; --warn: #d29922; --err: #f85149; --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, 'Segoe UI', Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px;
           padding: 14px 22px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 16px; font-family: var(--mono);
              color: var(--accent); }
  header .sub { color: var(--dim); font-size: 12px; }
  header nav { margin-left: 24px; }
  header nav a { color: var(--dim); text-decoration: none; font-size: 13px;
                 margin-right: 14px; }
  header nav a.active, header nav a:hover { color: var(--accent); }
  header .conn { margin-left: auto; font-size: 12px; color: var(--dim); }
  header .conn .dot { display: inline-block; width: 8px; height: 8px;
                      border-radius: 50%; margin-right: 5px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--err); }
  main { padding: 20px 22px; max-width: 1100px; margin: 0 auto; }
  .banner { padding: 8px 12px; margin-bottom: 16px; border-radius: 6px;
            background: rgba(248,81,73,.12); border: 1px solid var(--err);
            color: var(--err); font-size: 13px; display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 600; font-size: 12px;
       text-transform: uppercase; letter-spacing: .04em; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: rgba(88,166,255,.07); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px;
           font-size: 11px; font-family: var(--mono);
           border: 1px solid var(--border); }
  .badge.run  { color: var(--ok);   border-color: var(--ok); }
  .badge.stop { color: var(--dim); }
  .badge.deg  { color: var(--warn); border-color: var(--warn); }
  .badge.legacy, .badge.err { color: var(--err); border-color: var(--err); }
  .badge.miss { color: var(--err);  border-color: var(--err); }
  .badge.full { color: var(--ok);  border-color: var(--ok); }
  .badge.dim  { color: var(--dim); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
           gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 8px; padding: 14px 16px; }
  .card h2 { margin: 0 0 10px; font-size: 13px; color: var(--dim);
             text-transform: uppercase; letter-spacing: .05em;
             display: flex; align-items: center; gap: 8px; }
  .card h2 .cli { margin-left: auto; font-size: 11px; text-transform: none;
                  letter-spacing: 0; color: var(--dim);
                  font-family: var(--mono); font-weight: 400; }
  .card h2 button { font-size: 11px; padding: 2px 10px; margin-left: 8px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
  .kv .k { color: var(--dim); } .kv .v { font-family: var(--mono); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { padding: 2px 10px; border-radius: 12px; font-size: 12px;
          background: var(--bg); border: 1px solid var(--border); }
  .chip b { font-family: var(--mono); }
  pre { margin: 0; max-height: 340px; overflow: auto; background: var(--bg);
        border: 1px solid var(--border); border-radius: 6px; padding: 10px;
        font-family: var(--mono); font-size: 11.5px; line-height: 1.45; }
  .empty { color: var(--dim); font-size: 13px; padding: 8px 0; }
  a.back { color: var(--accent); text-decoration: none; font-size: 13px;
           display: inline-block; margin-bottom: 14px; }
  a.dl { color: var(--accent); text-decoration: none; font-size: 12px;
         font-family: var(--mono); }
  select, button { background: var(--bg); color: var(--fg);
                   border: 1px solid var(--border); border-radius: 6px;
                   padding: 4px 10px; font-size: 12px; font-family: var(--mono);
                   cursor: pointer; }
  button.live-on { color: var(--ok); border-color: var(--ok); }
  .decision-blocked { color: var(--err); }
  .decision-flagged { color: var(--warn); }
  .decision-allowed { color: var(--ok); }
  footer { padding: 20px 22px 30px; color: var(--dim); font-size: 12px; }
  footer code { font-family: var(--mono); color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>agentcage</h1><span class="sub">web dashboard</span>
  <nav>
    <a href="#/" id="nav-cages">cages</a>
    <a href="#/doctor" id="nav-doctor">doctor</a>
  </nav>
  <span class="conn"><span class="dot ok" id="conn-dot"></span><span id="conn-label">connected</span></span>
</header>
<main>
  <div class="banner" id="banner"></div>
  <div id="view"></div>
</main>
<footer>read-only view · every panel has a CLI twin · <code>agentcage --help</code></footer>

<script>
'use strict';

const $view = document.getElementById('view');
const $banner = document.getElementById('banner');
const REFRESH_MS = 5000;

// Live-tail preferences survive re-renders; the sockets themselves do
// not — every render closes and (if still wanted) reopens them, so the
// 5 s polling refresh can never stack a second EventSource.
const liveWanted = { traffic: false, logs: false };
const liveSocks = { traffic: null, logs: null };

function showBanner(msg) {
  $banner.textContent = msg;
  $banner.style.display = msg ? 'block' : 'none';
  document.getElementById('conn-dot').className = 'dot ' + (msg ? 'bad' : 'ok');
  document.getElementById('conn-label').textContent = msg ? 'disconnected' : 'connected';
}

function closeLive() {
  for (const k of Object.keys(liveSocks)) {
    if (liveSocks[k]) { liveSocks[k].close(); liveSocks[k] = null; }
  }
}

async function api(path) {
  const res = await fetch(path, { headers: { 'Accept': 'application/json' } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function statusBadge(status) {
  const cls = status.startsWith('running') ? 'run'
            : status.startsWith('degraded') ? 'deg'
            : status.startsWith('stopped') || status === 'exited' ? 'stop'
            : 'err';
  return `<span class="badge ${cls}">${esc(status)}</span>`;
}

function setNav() {
  const route = location.hash || '#/';
  document.getElementById('nav-cages').className =
    route.startsWith('#/cage/') || route === '#/' ? 'active' : '';
  document.getElementById('nav-doctor').className =
    route === '#/doctor' ? 'active' : '';
}

// ── overview ───────────────────────────────────────────────

function renderOverview(data) {
  if (!data.cages.length)
    return '<div class="empty">No cages found. <code>agentcage init NAME</code> to create one.</div>';
  const rows = data.cages.map(c => {
    const secs = c.secrets
      ? `<span class="badge ${c.secrets.missing ? 'miss' : 'full'}">${c.secrets.present}/${c.secrets.expected}${c.secrets.missing ? ' · ' + c.secrets.missing + ' missing' : ''}</span>` : '';
    const doms = c.domains ? `<span class="badge dim">${esc(c.domains.mode)} · ${c.domains.domains}</span>` : '';
    return `<tr class="row" data-cage="${esc(c.name)}">
      <td class="mono">${esc(c.name)}</td>
      <td>${statusBadge(c.status)}</td>
      <td class="mono">${esc(c.lifecycle || '')}</td>
      <td class="mono">${esc(c.isolation || '')}</td>
      <td>${secs}</td><td>${doms}</td>
      <td class="mono">${esc(c.scaffold && c.scaffold !== '-' ? c.scaffold : '')}</td>
      <td class="mono">${esc(c.version || '')}</td></tr>`;
  }).join('');
  return `<table><thead><tr>
    <th>Name</th><th>Status</th><th>Lifecycle</th><th>Isolation</th>
    <th>Secrets</th><th>Domains</th><th>Scaffold</th><th>Version</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

// ── doctor ──────────────────────────────────────────────────

function renderDoctor(data) {
  const rows = data.checks.map(c => `<tr>
    <td><span class="badge ${c.level === 'pass' ? 'full' : c.level === 'warn' ? 'deg' : 'err'}">${esc(c.level)}</span></td>
    <td>${esc(c.message)}</td>
    <td class="mono">${esc(c.hint || '')}</td></tr>`).join('');
  return `<div class="chips">
      <span class="chip">pass <b>${data.pass}</b></span>
      <span class="chip" style="color:var(--warn)">warn <b>${data.warn}</b></span>
      <span class="chip" style="color:var(--err)">error <b>${data.error}</b></span>
    </div>
    <table><thead><tr><th>Level</th><th>Check</th><th>Hint</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="3" class="empty">No checks ran.</td></tr>'}</tbody></table>`;
}

// ── cage detail ────────────────────────────────────────────

function kv(pairs) {
  return '<div class="kv">' + pairs.map(([k, v]) =>
    `<div class="k">${esc(k)}</div><div class="v">${v ?? ''}</div>`).join('') + '</div>';
}

function renderServices(services) {
  return services.map(s =>
    `<span class="badge ${s.running ? 'run' : 'stop'}">${esc(s.service)} ${s.running ? '● running' : '○ stopped'}</span>`)
    .join(' ');
}

function renderSecrets(data) {
  if (data.error) return `<div class="empty">${esc(data.error)}</div>`;
  if (!data.secrets.length) return '<div class="empty">No secrets expected.</div>';
  const rows = data.secrets.map(s => `<tr>
    <td class="mono">${esc(s.name)}</td>
    <td>${s.present === null ? '<span class="badge dim">unknown</span>'
      : `<span class="badge ${s.present ? 'full' : 'miss'}">${s.present ? 'set' : 'MISSING'}</span>`}</td>
    <td class="mono">${s.inject_to ? esc(s.inject_to.join(', ')) : '<span style="color:var(--dim)">all allowed domains</span>'}</td>
    </tr>`).join('');
  return `<table><thead><tr><th>Secret</th><th>Status</th><th>Inject scope</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderAllowlist(data) {
  const doms = data.domains.length ? data.domains.map(d =>
    `<tr><td class="mono">${esc(d.domain)}</td>
     <td>${d.passthrough ? '<span class="badge dim">passthrough</span>' : ''}</td>
     <td class="mono">${d.expires ? 'expires ' + esc(d.expires) : ''}</td></tr>`).join('')
    : '<tr><td colspan="3" class="empty">No domains in the baseline.</td></tr>';
  const grantsHtml = data.grants_note
    ? `<div class="empty">${esc(data.grants_note)}</div>`
    : data.grants.length
      ? '<table><thead><tr><th>Domain</th><th>Expires</th><th>Reason</th><th>Source</th></tr></thead><tbody>'
        + data.grants.map(g => `<tr>
        <td class="mono">${esc(g.domain)}</td>
        <td class="mono">${esc(g.expires_at || '—')}</td>
        <td class="mono">${esc(g.reason || '')}</td>
        <td class="mono">${esc(g.source || '')}</td></tr>`).join('')
        + '</tbody></table>'
      : '<div class="empty">No runtime grants.</div>';
  return `<h2 style="font-size:13px;color:var(--dim);text-transform:uppercase;margin:14px 0 8px">Domains — ${esc(data.mode)}</h2>
    <table><thead><tr><th>Domain</th><th></th><th>Expiry</th></tr></thead><tbody>${doms}</tbody></table>
    <h2 style="font-size:13px;color:var(--dim);text-transform:uppercase;margin:14px 0 8px">Runtime grants (Policy API)</h2>
    ${grantsHtml}`;
}

function summaryChips(s) {
  return [
    ['total', s.total || 0],
    ['allowed', (s.decisions || {}).allowed || 0],
    ['blocked', (s.decisions || {}).blocked || 0, 'var(--err)'],
    ['flagged', (s.decisions || {}).flagged || 0, 'var(--warn)'],
  ].map(([k, v, c]) =>
    `<span class="chip"${c ? ` style="color:${c}"` : ''}>${esc(k)} <b>${v}</b></span>`).join('');
}

function trafficRow(e) {
  return `<tr>
    <td class="mono">${esc((e.ts || '').slice(11, 23))}</td>
    <td class="mono">${esc(e.direction || '')}</td>
    <td class="mono">${esc(e.method || '')}</td>
    <td class="mono">${esc(e.host || '')}${esc(e.path || '')}</td>
    <td class="decision-${esc(e.decision || '')} mono">${esc(e.decision || '')}</td>
    <td class="mono">${esc(e.reason || '')}</td></tr>`;
}

function renderTraffic(data, name) {
  const s = data.summary || {};
  const topHosts = Object.entries(s.top_hosts || {}).slice(0, 6)
    .map(([h, n]) => `<span class="chip">${esc(h)} <b>${n}</b></span>`).join('');
  const rows = (data.entries || []).slice().reverse().map(trafficRow).join('');
  const liveBtn = `<button id="live-traffic" class="${liveWanted.traffic ? 'live-on' : ''}">${liveWanted.traffic ? '● live' : '○ live'}</button>`;
  return `<div class="chips">${liveBtn}${summaryChips(s)}</div>
    ${topHosts ? '<div class="chips">' + topHosts + '</div>' : ''}
    <div id="live-traffic-wrap" style="display:none;margin-bottom:8px">
      <table><thead><tr><th>Time</th><th>Dir</th><th>Method</th><th>Host / path</th><th>Decision</th><th>Reason</th></tr></thead>
      <tbody id="live-traffic-body"></tbody></table></div>
    ${data.count ? `<table><thead><tr><th>Time</th><th>Dir</th><th>Method</th><th>Host / path</th><th>Decision</th><th>Reason</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<div class="empty">${data.note ? esc(data.note) : 'No audit entries match.'}</div>`}`;
}

function renderDns(data) {
  const s = data.summary || {};
  const top = Object.entries(s.top_hosts || {}).slice(0, 8)
    .map(([h, n]) => `<span class="chip">${esc(h)} <b>${n}</b></span>`).join('');
  const blocked = Object.entries(s.top_blocked_hosts || {}).slice(0, 8)
    .map(([h, n]) => `<span class="chip" style="color:var(--err)">${esc(h)} <b>${n}</b></span>`).join('');
  const rows = (data.entries || []).slice().reverse().map(trafficRow).join('');
  return `<div class="chips">${summaryChips(s)}</div>
    ${top ? '<div class="chips">' + top + '</div>' : ''}
    ${blocked ? '<div class="chips">' + blocked + '</div>' : ''}
    ${data.count ? `<table><thead><tr><th>Time</th><th>Dir</th><th></th><th>Domain</th><th>Decision</th><th>Reason</th></tr></thead><tbody>${rows}</tbody></table>`
      : '<div class="empty">No DNS queries recorded yet.</div>'}`;
}

function renderCapture(data, name) {
  if (!data.captured)
    return `<div class="empty">${esc(data.detail || '')}</div>`;
  const rows = (data.entries || []).slice().reverse().map(e => `<tr>
    <td class="mono">${esc((e.ts || '').slice(0, 23))}</td>
    <td class="mono">${esc(e.direction || '')}</td>
    <td class="mono">${esc(e.method || '')}</td>
    <td class="mono">${esc(e.host || '')}</td>
    <td class="mono">${e.status ?? '—'}</td>
    <td class="decision-${esc(e.decision || '')} mono">${esc(e.decision || '')}</td></tr>`).join('');
  return `<div class="chips">
      <span class="chip">flows <b>${data.count}</b></span>
      <span class="chip">size <b>${(data.size / 1024).toFixed(1)} KiB</b></span>
      <a class="dl" href="/api/v1/cages/${esc(name)}/capture/har">download HAR (inbound)</a>
    </div>
    ${rows ? `<table><thead><tr><th>Time</th><th>Dir</th><th>Method</th><th>Host</th><th>Status</th><th>Decision</th></tr></thead><tbody>${rows}</tbody></table>`
      : '<div class="empty">No captured flows.</div>'}`;
}

function renderLogs(data, name) {
  const liveBtn = `<button id="live-logs" class="${liveWanted.logs ? 'live-on' : ''}">${liveWanted.logs ? '● live' : '○ live'}</button>`;
  return `<div class="chips">${liveBtn}<span class="chip">services <b>${esc((data.services || []).join(', '))}</b></span><span class="chip" style="color:var(--dim)">agentcage cage logs -f ${esc(name)}</span></div>
    <pre id="log-lines">${esc((data.lines || []).join('\n'))}</pre>`;
}

// ── live wiring ─────────────────────────────────────────────

function startLiveTraffic(name) {
  const sock = new EventSource(`/api/v1/cages/${name}/traffic/stream`);
  liveSocks.traffic = sock;
  document.getElementById('live-traffic-wrap').style.display = 'block';
  sock.onmessage = ev => {
    const e = JSON.parse(ev.data);
    const body = document.getElementById('live-traffic-body');
    if (!body) return;
    body.insertAdjacentHTML('afterbegin', trafficRow(e));
    while (body.rows.length > 100) body.deleteRow(-1);
  };
  sock.onerror = () => { /* banner shows via polling; view re-renders */ };
}

function startLiveLogs(name) {
  const sock = new EventSource(`/api/v1/cages/${name}/logs/stream`);
  liveSocks.logs = sock;
  sock.onmessage = ev => {
    const e = JSON.parse(ev.data);
    const pre = document.getElementById('log-lines');
    if (!pre) return;
    pre.textContent += (pre.textContent ? '\n' : '') + e.line;
    const lines = pre.textContent.split('\n');
    if (lines.length > 500) pre.textContent = lines.slice(-500).join('\n');
    pre.scrollTop = pre.scrollHeight;
  };
}

// ── views / routing ─────────────────────────────────────────

async function renderCageView(name) {
  const [detail, secrets, allowlist, traffic, dns, capture, logs] = await Promise.all([
    api(`/api/v1/cages/${name}`),
    api(`/api/v1/cages/${name}/secrets`),
    api(`/api/v1/cages/${name}/allowlist`),
    api(`/api/v1/cages/${name}/traffic?limit=50`),
    api(`/api/v1/cages/${name}/dns?limit=50`),
    api(`/api/v1/cages/${name}/capture?limit=50`),
    api(`/api/v1/cages/${name}/logs?lines=100`),
  ]);
  const svc = renderServices(detail.services || []);
  const head = `
    <a class="back" href="#/">← all cages</a>
    <div class="cards">
      <div class="card"><h2>Cage</h2>${kv([
        ['name', esc(detail.name)], ['status', statusBadge(detail.status)],
        ['services', svc], ['isolation', esc(detail.isolation)],
        ['image', esc(detail.image)], ['lifecycle', esc(detail.lifecycle)],
        ['ports', esc((detail.ports || []).join(', ') || '—')],
        ['version', esc(detail.version)],
      ])}</div>
      <div class="card"><h2>Secrets<span class="cli">agentcage secret list ${esc(name)}</span></h2>${renderSecrets(secrets)}</div>
    </div>
    <div style="height:16px"></div>
    <div class="cards">
      <div class="card"><h2>Allowlist<span class="cli">agentcage domain list ${esc(name)}</span></h2>
        ${renderAllowlist(allowlist)}</div>
      <div class="card"><h2>DNS<span class="cli">agentcage cage audit ${esc(name)} --method DNS</span></h2>
        ${renderDns(dns)}</div>
    </div>
    <div style="height:16px"></div>
    <div class="card"><h2>Traffic<span class="cli">agentcage cage audit ${esc(name)}</span></h2>${renderTraffic(traffic, name)}</div>
    <div style="height:16px"></div>
    <div class="cards">
      <div class="card"><h2>Capture<span class="cli">agentcage cage har ${esc(name)}</span></h2>${renderCapture(capture, name)}</div>
    </div>
    <div style="height:16px"></div>
    <div class="card"><h2>Logs<span class="cli">agentcage cage logs ${esc(name)}</span></h2>${renderLogs(logs, name)}</div>`;
  $view.innerHTML = head;

  // Buttons exist now — wire toggles, then open wanted streams.
  const tBtn = document.getElementById('live-traffic');
  const lBtn = document.getElementById('live-logs');
  if (tBtn) tBtn.onclick = () => {
    liveWanted.traffic = !liveWanted.traffic;
    closeLive(); render();
  };
  if (lBtn) lBtn.onclick = () => {
    liveWanted.logs = !liveWanted.logs;
    closeLive(); render();
  };
  if (liveWanted.traffic) startLiveTraffic(name);
  if (liveWanted.logs) startLiveLogs(name);
}

async function renderOverviewView() {
  const data = await api('/api/v1/overview');
  $view.innerHTML = renderOverview(data);
  $view.querySelectorAll('tr.row').forEach(tr =>
    tr.addEventListener('click', () => { location.hash = '#/cage/' + tr.dataset.cage; }));
}

async function renderDoctorView() {
  const data = await api('/api/v1/doctor');
  $view.innerHTML = `<h2 style="font-size:13px;color:var(--dim);text-transform:uppercase;margin:0 0 10px">Doctor <span style="font-weight:400;text-transform:none;letter-spacing:0;margin-left:8px">agentcage doctor</span></h2>${renderDoctor(data)}`;
}

async function render() {
  closeLive();
  setNav();
  const m = location.hash.match(/^#\/cage\/([a-z0-9-]+)$/);
  try {
    if (m) await renderCageView(m[1]);
    else if (location.hash === '#/doctor') await renderDoctorView();
    else await renderOverviewView();
    showBanner('');
  } catch (err) {
    showBanner(err.message);
  }
}

window.addEventListener('hashchange', render);
render();
setInterval(() => {
  // Poll only when not tailing live — a live view updates itself.
  if (!liveWanted.traffic && !liveWanted.logs) render();
}, REFRESH_MS);
</script>
</body>
</html>
