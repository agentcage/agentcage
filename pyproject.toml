[project]
name = "agentcage"
dynamic = ["version"]
requires-python = ">=3.12"
description = "Defense-in-depth proxy sandbox for AI agents"
authors = [{name = "Luca Martinetti"}]
license = {text = "MIT"}
readme = "README.md"
keywords = ["ai", "agent", "sandbox", "proxy", "security", "mitmproxy", "container"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
agentcage = "agentcage.cli:main"

[project.urls]
Homepage = "https://github.com/agentcage/agentcage"
Repository = "https://github.com/agentcage/agentcage"
Documentation = "https://github.com/agentcage/agentcage/tree/master/docs"
Issues = "https://github.com/agentcage/agentcage/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/agentcage/data/proxy"]
markers = [
    "e2e_vm: end-to-end tests requiring Lima VM (slow)",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: the root VERSION file. The git
# tag, the CHANGELOG heading and the built package all have to agree with
# it -- `scripts/check-version.sh` enforces that, and the Release workflow
# runs it before building. Keeping the number in one file (rather than in
# pyproject) is what lets a second build system read it too, which the
# Rust port needs.
[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>[^\\s]+)"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcage"]

# VERSION is not under src/, so it needs saying explicitly or a build from
# the sdist cannot resolve its own version.
[tool.hatch.build.targets.sdist]
include = ["src/agentcage", "VERSION", "README.md", "CHANGELOG.md", "tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "cryptography>=41",
]
