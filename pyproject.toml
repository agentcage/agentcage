# Test environment for the egress proxy. Not a package.
#
# The host CLI is a Rust binary (see Cargo.toml). The only Python in
# agentcage is the egress proxy under `src/agentcage/data/proxy/`, and it
# ships inside the mitmproxy image — `Containerfile.egress` pip-installs
# its two dependencies there, which is the only place they are ever
# installed for real.
#
# This file exists so `uv run pytest` can run the proxy suite:
# `pythonpath` below lets the tests import both `agentcage.data.proxy.X`
# and bare `X`, the two spellings the egress image itself uses, with
# nothing installed.
#
# The `[project]` table is only there because `uv lock` requires one. Its
# version is a fixed placeholder, not agentcage's version: that lives in
# the root VERSION file and nothing here reads it.

[project]
name = "agentcage-proxy-tests"
version = "0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/agentcage/data/proxy"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # What Containerfile.egress installs.
    "pyyaml>=6.0",
    "cryptography>=41",
]
